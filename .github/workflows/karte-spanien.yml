name: Spanien-Portugal-Karte bauen

# Baut die Offline-Karte Spanien + Portugal (inkl. Balearen, Kanaren, Madeira, Azoren)
# fuer das Fehnverleih Navi: PMTiles v3, Vektorkacheln im OpenMapTiles-Schema (wie deutschland.pmtiles).
# Ergebnis: Release "karte-spanien-portugal" mit den Teilen spanien-portugal-teil-00, -01, ...
# Die Teile kommen unveraendert in den Ordner "karten" auf Strato.

on:
  workflow_dispatch:
  push:
    branches: [karte-spanien]
    paths: [.github/workflows/karte-spanien.yml]

permissions:
  contents: write

jobs:
  karte:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Speicherplatz freiraeumen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -sSfL -o planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      - name: OpenStreetMap-Daten Spanien + Portugal laden
        run: |
          mkdir -p data/sources
          curl -sSfL -o es.osm.pbf https://download.geofabrik.de/europe/spain-latest.osm.pbf
          curl -sSfL -o pt.osm.pbf https://download.geofabrik.de/europe/portugal-latest.osm.pbf
          osmium merge es.osm.pbf pt.osm.pbf -o data/sources/iberien.osm.pbf
          rm es.osm.pbf pt.osm.pbf
          ls -lh data/sources

      - name: Karte bauen (dauert)
        run: |
          java -Xmx11g -jar planetiler.jar \
            --osm-path=data/sources/iberien.osm.pbf \
            --download \
            --bounds=-31.6,27.4,4.6,44.0 \
            --output=spanien-portugal.pmtiles \
            --nodemap-type=array --storage=mmap \
            --force
          ls -lh spanien-portugal.pmtiles

      - name: Pruefen, ob die Datei zum Navi passt
        run: |
          python3 - <<'EOF'
          import struct
          d = open('spanien-portugal.pmtiles', 'rb').read(127)
          assert d[:7] == b'PMTiles' and d[7] == 3, 'kein PMTiles v3'
          assert d[99] == 1, 'keine Vektorkacheln (MVT)'
          minz, maxz = d[100], d[101]
          w, s, o, n = [x / 1e7 for x in struct.unpack('<iiii', d[102:118])]
          print('OK  Zoom', minz, '-', maxz, ' Bereich', w, s, o, n)
          assert maxz >= 14
          EOF
          ( curl -sSfL -o pmtiles.tgz https://github.com/protomaps/go-pmtiles/releases/download/v1.22.3/go-pmtiles_1.22.3_Linux_x86_64.tar.gz && tar xzf pmtiles.tgz pmtiles && ./pmtiles show spanien-portugal.pmtiles | grep -E "vector_layers|transportation|place" | head -5 ) || true

      - name: In Teile zerlegen (je 1,9 GB)
        run: |
          mkdir aus
          split -b 1900m -d -a 2 spanien-portugal.pmtiles aus/spanien-portugal-teil-
          cd aus && sha256sum ../spanien-portugal.pmtiles | sed 's#\.\./##' > PRUEFSUMME.txt && ls -l >> PRUEFSUMME.txt && cat PRUEFSUMME.txt

      - name: Als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete karte-spanien-portugal -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create karte-spanien-portugal aus/* -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Offline-Karte Spanien + Portugal ($(date +%d.%m.%Y))" \
            --notes "Alle Teile spanien-portugal-teil-NN herunterladen und unveraendert in den Ordner karten auf Strato legen. Daten: (c) OpenStreetMap-Mitwirkende, ODbL."
