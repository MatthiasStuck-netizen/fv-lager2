name: Navi Android-Teil erweitern

# Setzt in die vorhandene Navi-APK (Android-Teil nur kompiliert vorhanden) einen kleinen Zusatz ein:
#  - Klasse de.fehnverleih.navi.Satelliten (Java, nativ/) als zusätzliche classes2.dex
#  - in der Brücke zur Oberfläche (MainActivity$Bruecke) die Methode satelliten() für FVNative.satelliten()
# Ergebnis: Release "navi-nativ" mit der UNSIGNIERTEN APK. Oberfläche und Unterschrift kommen danach mit werkzeuge/bauen.py dazu.

on:
  workflow_dispatch:
  push:
    branches: [navi-nativ]

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Werkzeuge
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" | tee -a $GITHUB_ENV
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          ls $SDK/platforms $SDK/build-tools | tee -a protokoll.txt
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          curl -sSfL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          java -jar apktool.jar --version
      - name: APK zerlegen
        run: |
          java -jar apktool.jar d -r -f basis/Fehnverleih-Navi-4.1.1.apk -o deko
          ls deko; ls deko/smali*/de/fehnverleih/navi/ | head -50
          B=$(ls deko/smali*/de/fehnverleih/navi/MainActivity\$Bruecke.smali)
          echo "BRUECKE=$B" >> $GITHUB_ENV
          grep -nE "^\.(class|super|field|method)|JavascriptInterface" "$B" | head -80 | tee -a protokoll.txt
      - name: Satelliten-Klasse übersetzen
        run: |
          JAR=$ANDROID_HOME/platforms/android-35/android.jar
          mkdir -p kl dexaus
          javac --release 8 -encoding UTF-8 -cp "$JAR" -d kl nativ/de/fehnverleih/navi/*.java
          $ANDROID_HOME/build-tools/35.0.0/d8 --release --min-api 24 --lib "$JAR" --output dexaus $(find kl -name '*.class')
          ls -l dexaus
      - name: Brücke ergänzen
        run: |
          python3 - <<'EOF'
          import os, re
          p = os.environ['BRUECKE']; s = open(p, encoding='utf-8').read()
          m = re.search(r'^\.field [^\n]*? (\S+):Lde/fehnverleih/navi/MainActivity;', s, re.M)
          assert m, 'Feld mit MainActivity nicht gefunden'
          feld = m.group(1)
          assert 'satelliten()' not in s
          neu = '''
          .method public final satelliten()Ljava/lang/String;
              .registers 2
              .annotation runtime Landroid/webkit/JavascriptInterface;
              .end annotation
              iget-object v0, p0, Lde/fehnverleih/navi/MainActivity$Bruecke;->%s:Lde/fehnverleih/navi/MainActivity;
              check-cast v0, Landroid/content/Context;
              invoke-static {v0}, Lde/fehnverleih/navi/Satelliten;->json(Landroid/content/Context;)Ljava/lang/String;
              move-result-object v0
              return-object v0
          .end method
          ''' % feld
          neu = '\n'.join(l[10:] if l.startswith(' ' * 10) else l for l in neu.split('\n'))
          s = s.rstrip() + '\n' + neu + '\n'
          open(p, 'w', encoding='utf-8').write(s)
          print('Feld:', feld)
          EOF
          tail -15 "$BRUECKE" | tee -a protokoll.txt
      - name: Wieder zusammensetzen
        run: |
          java -jar apktool.jar b deko -o unsigniert.apk
          ls deko/build/apk || true
          if unzip -l unsigniert.apk | grep -q 'classes2.dex'; then echo "::error::classes2.dex gibt es schon"; exit 1; fi
          cp dexaus/classes.dex classes2.dex && zip -q unsigniert.apk classes2.dex
          unzip -l unsigniert.apk | grep -E 'classes|Manifest|resources.arsc'
          mkdir aus && cp unsigniert.apk aus/Navi-nativ-unsigniert.apk
      - name: Protokoll bereitstellen (auch bei Fehler)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete navi-nativ-protokoll -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          touch protokoll.txt
          gh release create navi-nativ-protokoll protokoll.txt -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Navi nativ: Protokoll" --notes "Bauprotokoll"
      - name: Bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete navi-nativ -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create navi-nativ aus/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Navi: Android-Teil mit Satelliten (unsigniert)" --notes "Zwischenstand fuer den Bau, nicht zum Installieren."

  geraetetest:
    needs: bauen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Test-APK bauen (Wegwerf-Schlüssel, nur zum Testen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download navi-nativ -R "$GITHUB_REPOSITORY" -p 'Navi-nativ-unsigniert.apk'
          keytool -genkeypair -keystore wegwerf.jks -storepass wegwerf123 -keypass wegwerf123 -alias test -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Test" > /dev/null
          pip install -q cryptography
          python3 werkzeug/bauen.py Navi-nativ-unsigniert.apk www wegwerf.jks wegwerf123 test test.apk 4.3.0 430
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: App im Emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 4096
          script: bash werkzeug/geraetetest.sh
      - name: Ergebnis bereitstellen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p geraet; ls -l geraet
          gh release delete navi-nativ-test -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create navi-nativ-test geraet/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Navi nativ: Geraetetest" --notes "Bilder und Protokoll aus dem Emulator"
