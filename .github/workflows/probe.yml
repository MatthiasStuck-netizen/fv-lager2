name: Dienste pruefen
on:
  workflow_dispatch:
  push:
    branches: [ navi ]
    paths: [ 'werkzeug/probe.py', '.github/workflows/probe.yml' ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 werkzeug/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe, path: probe, retention-days: 3 }
