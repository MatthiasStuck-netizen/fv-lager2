name: Stempeluhr (Klassen übersetzen)
on:
  push:
    branches: [stempel-version]
permissions:
  contents: write
jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Übersetzen
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          JAR=$SDK/platforms/android-34/android.jar
          mkdir -p kl dexaus aus
          javac --release 8 -encoding UTF-8 -Xlint:-options -cp "$JAR" -d kl $(find src -name '*.java') 2>&1 | tee protokoll.txt
          $SDK/build-tools/34.0.0/d8 --release --min-api 24 --lib "$JAR" --output dexaus $(find kl -name '*.class') 2>&1 | tee -a protokoll.txt
          cp dexaus/classes.dex aus/classes.dex
      - name: Ausgabe
        if: always()
        run: |
          mkdir -p aus; touch protokoll.txt; cp protokoll.txt aus/
          git config user.name "Bau"; git config user.email "bau@fehnverleih.invalid"
          git checkout --orphan stempel-version-aus
          git rm -rq --cached . || true
          git add -f aus
          git commit -qm "Ausgabe $GITHUB_SHA"
          git push -f origin stempel-version-aus
